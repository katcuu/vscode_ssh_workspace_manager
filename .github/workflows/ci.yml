name: Check, package, and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Verify release tag matches extension version
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e 'const expected = "v" + require("./package.json").version;
          if (process.env.RELEASE_TAG !== expected) {
          console.error("Expected tag " + expected + ", got " + process.env.RELEASE_TAG);
          process.exit(1);
          }'
      - run: npm run package
        if: runner.os == 'Linux'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ssh-workspace-manager-vsix
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 30

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ssh-workspace-manager-vsix
          path: artifacts
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'process.env.RELEASE_TAG.slice(1)')"
          package="artifacts/ssh-workspace-manager-$version.vsix"
          test -f "$package"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$package" --clobber
          else
            gh release create "$RELEASE_TAG" "$package" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi

  publish-marketplace:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ssh-workspace-manager-vsix
          path: artifacts
      - name: Publish VSIX with GitHub OIDC
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "$RELEASE_TAG" = "v$version"
          package="artifacts/ssh-workspace-manager-$version.vsix"
          test -f "$package"
          npx @vscode/vsce publish --oidc --skip-duplicate --packagePath "$package"
